<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- 배경 그라데이션: 식욕을 돋우는 웜 탠저린 코랄 -->
    <linearGradient id="soloFavBgB" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FF3815"/>
    </linearGradient>

    <!-- 소복한 쌀밥 그라데이션 -->
    <linearGradient id="riceFavGradB" x1="64" y1="40" x2="64" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF0E6"/>
    </linearGradient>
  </defs>

  <!-- 1. 부드러운 스쿼클 베이스 -->
  <rect width="128" height="128" rx="28" fill="url(#soloFavBgB)"/>
  <!-- 테두리 림 (선명도 강화) -->
  <rect x="2" y="2" width="124" height="124" rx="26" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>

  <!-- 2. 밥그릇 & 지도 핀 일체형 바디 -->
  <!-- 밥그릇 둥근 몸체 (순백색) -->
  <path d="M26 56C26 78 44 94 64 94C84 94 102 78 102 56H26Z" fill="#FFFFFF"/>
  <!-- 밥그릇 굽 & 하단 지도 핀 포인트 결합 -->
  <path d="M53 94H75L64 108L53 94Z" fill="#FFFFFF"/>

  <!-- 소복하게 담긴 따뜻한 쌀밥 -->
  <ellipse cx="64" cy="56" rx="36" ry="16" fill="url(#riceFavGradB)"/>

  <!-- 밥그릇 중앙 지도 핀 마커 (16/32px 가독성 최적화) -->
  <path d="M64 25C56 25 50 31.2 50 39C50 48.5 64 61.5 64 61.5C64 61.5 78 48.5 78 39C78 31.2 72 25 64 25Z" fill="#FF451A"/>
  <circle cx="64" cy="37" r="4.5" fill="#FFFFFF"/>

  <!-- 따스한 김 (좌우) -->
  <path d="M40 42C38 36.5 42 32 40 27" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M88 42C90 36.5 86 32 88 27" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>

  <!-- 1인 혼밥 스마일 미소 -->
  <path d="M52 72C56.5 78.5 71.5 78.5 76 72" stroke="#FF451A" stroke-width="3.8" stroke-linecap="round"/>
  <!-- 볼터치 -->
  <circle cx="46" cy="69" r="3.2" fill="#FFA38A"/>
  <circle cx="82" cy="69" r="3.2" fill="#FFA38A"/>
</svg>
